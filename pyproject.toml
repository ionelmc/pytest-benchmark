[project]
name = "pytest-benchmark"
version = "5.3.0"
description = "A ``pytest`` fixture for benchmarking code. It will group the tests into rounds that are calibrated to the chosen timer."
requires-python = ">=3.10"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Ionel Cristian Mărieș", email = "contact@ionelmc.ro" },
]
keywords = [
    "benchmark",
    "pytest",
]
classifiers = [
    # complete classifier list: http://pypi.python.org/pypi?%3Aaction=list_classifiers
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    # uncomment if you test on these interpreters:
    # "Programming Language :: Python :: Implementation :: IronPython",
    # "Programming Language :: Python :: Implementation :: Jython",
    # "Programming Language :: Python :: Implementation :: Stackless",
    "Topic :: Utilities",
]
dependencies = [
    "py-cpuinfo2>=10.1",
    "pytest>=8.1",
]
dynamic = [
    "readme",
]

[project.urls]
"Changelog" = "https://pytest-benchmark.readthedocs.io/en/latest/changelog.html"
"Documentation" = "https://pytest-benchmark.readthedocs.io/"
"Issue Tracker" = "https://github.com/ionelmc/pytest-benchmark/issues"
"Sources" = "https://github.com/ionelmc/pytest-benchmark"

[project.scripts]
"py.test-benchmark" = "pytest_benchmark.cli:main"
pytest-benchmark = "pytest_benchmark.cli:main"

[project.entry-points.pytest11]
benchmark = "pytest_benchmark.plugin"

[project.optional-dependencies]
aspect = [
    "aspectlib",
]
elasticsearch = [
    "elasticsearch",
]
histogram = [
    "pygal",
    "pygaljs",
    "setuptools",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "nbmake>=1.5.5",
]

[build-system]
requires = [
    "setuptools>=80",
]
build-backend = "setuptools.build_meta"

[tool.mypy]
exclude = ["build"]

[[tool.mypy.overrides]]
module = [
    "aspectlib",  # ignore_missing_imports = true
    "cpuinfo",
    "pygal.*",
    "pygaljs",
]
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["static", "ci/templates"]
line-length = 140
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "RUF001",  # ruff-specific rules ambiguous-unicode-character-string
    "S101",  # flake8-bandit assert
    "S308",  # flake8-bandit suspicious-mark-safe-usage
    "S603",  # flake8-bandit subprocess-without-shell-equals-true
    "S607",  # flake8-bandit start-process-with-partial-path
    "E501",  # pycodestyle line-too-long
    "PTH123",
    "PT011",  # too broad pytest.raises
]
select = [
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "E",  # pycodestyle errors
    "EXE",  # flake8-executable
    "F",  # pyflakes
    "I",  # isort
    "INT",  # flake8-gettext
    "PIE",  # flake8-pie
    "PLC",  # pylint convention
    "PLE",  # pylint errors
    "PT",  # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RSE",  # flake8-raise
    "RUF",  # ruff-specific rules
    "S",  # flake8-bandit
    "UP",  # pyupgrade
    "W",  # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"ci/*" = ["S"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
forced-separate = ["conftest"]
force-single-line = true

[tool.ruff.format]
quote-style = "single"

[tool.setuptools.dynamic]
readme = { file = ["README.rst", "CHANGELOG.rst"] }
