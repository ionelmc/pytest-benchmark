# To install the git pre-commit hooks run:
#   prek install --install-hooks --overwrite
# To update the versions:
#   prek autoupdate
exclude: '^(\.tox|ci/templates|\.bumpversion\.cfg)(/|$)'
# Note the order is intentional to avoid multiple passes of the hooks
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      - id: ruff-check
        # Using --unsafe-fixes can change code behavior
        args: [--fix, --exit-non-zero-on-fix, --show-fixes, --unsafe-fixes]
      - id: ruff-format
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: 10da57f75d36ba93b257a4e7f2c70796fa2da683  # frozen: v1.9.8
    hooks:
      - id: tombi-format
        # args: [ "--offline" ]
      - id: tombi-lint
        # args: [ "--offline" ]
    # Should you use this offline, uncomment those args
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: debug-statements
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c  # frozen: v2.4.1
    hooks:
      - id: mypy
        args: ["."]
        pass_filenames: false
        additional_dependencies:
          - pytest
          - freezegun
          - py-cpuinfo2
          - jinja2
          - types-setuptools
          - elasticsearch
          - pygal
          - pygaljs
          - aspectlib
          - statistics
  - repo: https://github.com/crate-ci/typos
    rev: 7f9d0819ca1c008ade73f4b41fa9d258d48f605b  # frozen: v1.51.1
    hooks:
      - id: typos
